name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-android-web:
    name: Build Android APK & Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Distribution
        run: |
          npm run build
          cd dist && zip -r ../thermal-print-studio-web.zip . && cd ..

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Android APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release
          cd ..
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk ThermalStudio-Android.apk

      - name: Upload Android & Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-web-artifacts
          path: |
            ThermalStudio-Android.apk
            thermal-print-studio-web.zip

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Windows
        shell: pwsh
        run: |
          cd flutter_app
          flutter pub get
          flutter build windows --release
          cd ..
          Compress-Archive -Path flutter_app\build\windows\x64\runner\Release\* -DestinationPath ThermalStudio-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: ThermalStudio-Windows.zip

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Linux
        run: |
          cd flutter_app
          flutter pub get
          flutter build linux --release
          cd ..
          tar -czvf ThermalStudio-Linux.tar.gz -C flutter_app/build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: ThermalStudio-Linux.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-android-web, build-windows, build-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: List Artifacts
        run: |
          ls -la release-assets

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Thermal Studio ${{ steps.vars.outputs.tag }}
          body: |
            ## Thermal Studio Release ${{ steps.vars.outputs.tag }}

            ### 🚀 Pure Dart / Flutter Native Architecture
            - **100% Native Pure Dart:** Replaced webview/Capacitor with native Flutter for high performance, zero latency, and true cross-platform execution (Android, Windows, Linux, macOS).
            - **Reverse-Engineered Tiny Print Hardware Engine:** Replicated exact Bluetooth Low Energy protocol (`0x51 0x78` header, CRC-8 polynomial 0x07, Deepen energy Level 5 at 9200us pulse, and 50ms chunk pacing).
            - **Direct WYSIWYG Typewriter:** Click directly on paper to edit, format, and add blocks in-place without modal popups.
            - **Minimal OS Aesthetic & Tactile Physics:** High-contrast OLED monochrome interface with smooth tactile press response and paper feed entrance animations.
            - **Google Calendar Direct Sync:** One-tap agenda fetch and receipt layout for daily schedule printing.
            - **Multi-Font Engine:** Mono (POS), Clean (Sans), Editorial (Serif), Retro (Arcade), Typewriter.

            ### 📦 Release Assets
            - `ThermalStudio-Android.apk`: Native Android Application.
            - `ThermalStudio-Windows.zip`: Native Windows Application.
            - `ThermalStudio-Linux.tar.gz`: Native Linux Application.
            - `thermal-print-studio-web.zip`: Standalone Web App Distribution.
          files: release-assets/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
