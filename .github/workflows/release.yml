name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-android-web:
    name: Build Android APK & Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Distribution
        run: |
          npm run build
          cd dist && zip -r ../thermal-printer-os-web.zip . && cd ..

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Android APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release
          cd ..
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk ThermalPrinterOS-Android.apk

      - name: Upload Android & Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-web-artifacts
          path: |
            ThermalPrinterOS-Android.apk
            thermal-printer-os-web.zip

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Windows
        shell: pwsh
        run: |
          cd flutter_app
          flutter pub get
          flutter build windows --release
          cd ..
          Compress-Archive -Path flutter_app\build\windows\x64\runner\Release\* -DestinationPath ThermalPrinterOS-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: ThermalPrinterOS-Windows.zip

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Linux
        run: |
          cd flutter_app
          flutter pub get
          flutter build linux --release
          cd ..
          tar -czvf ThermalPrinterOS-Linux.tar.gz -C flutter_app/build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: ThermalPrinterOS-Linux.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-android-web, build-windows, build-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: List Artifacts
        run: |
          ls -la release-assets

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Thermal Printer OS ${{ steps.vars.outputs.tag }}
          body: |
            ## Thermal Printer OS Release ${{ steps.vars.outputs.tag }}

            ### 🚀 Pure Dart / Flutter Native Architecture
            - **Calibrated Print Quality (Exact Capacitor Match):** Implemented exact 1.15 contrast scaling and 138 threshold binarization from the Capacitor engine (`printEngine.ts` & `print_perfect_friday.py`) for deep, pitch-black typography without fuzzy artifacts on text characters.
            - **Full-Page Unclipped Rasterization:** Fixed paper width constraints with two-dimensional unbounded layout, ensuring the printer sees 100% of the receipt width (all 384 dots on 58mm / 576 dots on 80mm) and full vertical height from header to tear line without clipping.
            - **Hardware FIFO Breather (177B / 50ms):** Streamlines 177-byte packet chunks with 50ms pacing and an extra 100ms pause every 25 chunks to prevent hardware buffer overruns on long prints.
            - **Reordered Command Palette:** Re-organized tools logically as requested: First Note, then Todo, then Schedule, then Expense (Row 1), Alert, Photo, Quote, QR Code (Row 2), Header, Table, Line, Gap (Row 3).
            - **3-Row Command Tool Bar (Zero Horizontal Scrolling):** 12 equal-width, immediately visible tools across 3 rows with 0 scrolling.
            - **Zero-Clipping Responsive Navbar:** Sync and Bluetooth Pair buttons are 100% visible with constrained device label width and auto-shrinking branding.
            - **Google Calendar Multi-Calendar Aggregation:** Fetches events from primary and all selected sub-calendars, forces auth cache refresh, requests `calendar.events.readonly`, and falls back to upcoming events if today is clear.
            - **⚡ 100% Guaranteed Secret iCal Link Sync:** Universal zero-configuration calendar sync via Google Calendar's private iCal link (or Apple Calendar / Outlook). No Google Cloud Console account, OAuth setup, or SHA-1 fingerprints needed. Persisted automatically in `SharedPreferences`.
            - **Transparent Calendar Diagnostics:** Detailed error reporting and resolution hints for OAuth scopes and Google Cloud SHA-1 fingerprints.
            - **100% Native Pure Dart:** Built with Flutter for high performance, zero latency, and true cross-platform execution (Android, Windows, Linux, macOS).
            - **Reverse-Engineered Tiny Print Hardware Engine:** Replicated exact Bluetooth Low Energy protocol (`0x51 0x78` header, CRC-8 polynomial 0x07, Deepen energy Level 5 at 9200us pulse, and 50ms chunk pacing).
            - **Unmissable Bottom Print Dock:** Large, prominent tactile master print button with real-time Bluetooth online/offline status and instant pairing.
            - **Photo & Image Upload Engine:** Added gallery/camera photo picker with automatic Floyd-Steinberg dithering and high-contrast thresholding for sharp thermal prints.
            - **Expense & Budget Tracker:** Itemized receipt block with real-time tax calculation and total computation.
            - **High-Contrast Important Callout:** Level 1 inverted memorandum box for urgent alerts and instructions.
            - **Motivational Quotes & 1-Tap Shuffle:** Built-in focus quotes with 1-tap quote shuffling.
            - **Custom Gap / Spacing Controls:** Dedicated adjustable spacer blocks and ample vertical line-height so text never collides or gets hidden.
            - **Multi-Font Engine:** Mono (POS), Clean (Sans), Editorial (Serif), Retro (Arcade), Typewriter.

            ### 📦 Release Assets
            - `ThermalPrinterOS-Android.apk`: Native Android Application.
            - `ThermalPrinterOS-Windows.zip`: Native Windows Application.
            - `ThermalPrinterOS-Linux.tar.gz`: Native Linux Application.
            - `thermal-printer-os-web.zip`: Standalone Web App Distribution.
          files: release-assets/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
