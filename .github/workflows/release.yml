name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Distribution
        run: npm run build

      - name: Archive Production Web Build
        run: |
          cd dist && zip -r ../thermal-print-studio-web.zip . && cd ..

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Thermal Studio ${{ steps.vars.outputs.tag }}
          body: |
            ## Thermal Studio Release ${{ steps.vars.outputs.tag }}

            ### 🚀 New Features & Enhancements
            - **Google Calendar Direct Sign-In:** 1-click Google OAuth 2.0 sync to load live daily schedules directly onto thermal paper.
            - **Calibrated Tiny Print Hardware Protocol:** Reverse-engineered from Tiny Print APK 1.3.87 with exact CRC8 checksums, quality concentration level 5 (Deepen / 9200 energy), and 50ms pacing.
            - **Pocket Thermal Printer Support:** Tested and calibrated for Model X5, X5h, X6, C9, C15, PeriPage, and standard ESC/POS 58mm/80mm receipt printers.
            - **Smart Binarization:** Adaptive luminance thresholding (`mean - 13`) and Floyd-Steinberg / Atkinson dithering algorithms.
            - **Compact Tear Margins:** Optimized stepper motor paper advance to leave a clean, non-wasteful tear-off margin.
            - **Multi-Platform:** Web Bluetooth, Web Serial, Electron Desktop, and PWA offline capabilities.

            ### 📦 Assets Included
            - `thermal-print-studio-web.zip`: Standalone production web build.
          files: |
            thermal-print-studio-web.zip
          draft: false
          prerelease: false
