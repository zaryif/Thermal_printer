name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-android-web:
    name: Build Android APK & Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Distribution
        run: |
          npm run build
          cd dist && zip -r ../thermal-printer-os-web.zip . && cd ..

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Android APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release
          cd ..
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk ThermalPrinterOS-Android.apk

      - name: Upload Android & Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-web-artifacts
          path: |
            ThermalPrinterOS-Android.apk
            thermal-printer-os-web.zip

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Windows
        shell: pwsh
        run: |
          cd flutter_app
          flutter pub get
          flutter build windows --release
          cd ..
          Compress-Archive -Path flutter_app\build\windows\x64\runner\Release\* -DestinationPath ThermalPrinterOS-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: ThermalPrinterOS-Windows.zip

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Linux
        run: |
          cd flutter_app
          flutter pub get
          flutter build linux --release
          cd ..
          tar -czvf ThermalPrinterOS-Linux.tar.gz -C flutter_app/build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: ThermalPrinterOS-Linux.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-android-web, build-windows, build-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: List Artifacts
        run: |
          ls -la release-assets

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Thermal Printer OS ${{ steps.vars.outputs.tag }}
          body: |
            ## Thermal Printer OS Release ${{ steps.vars.outputs.tag }}

            ### 🚀 Pure Dart / Flutter Native Architecture
            - **Google Calendar & iCal Multi-Sync Modal:** Sleek tabbed interface supporting ⚡ 100% reliable secret iCal link sync (zero-config, no OAuth/SHA-1 setup needed), 🌐 native Google OAuth sign-in with granular scope verification, and 📝 quick plain-text schedule parser.
            - **Transparent Calendar Diagnostics:** Detailed error reporting and resolution hints for OAuth scopes and Google Cloud SHA-1 fingerprints, replacing silenced failures.
            - **100% Native Pure Dart:** Built with Flutter for high performance, zero latency, and true cross-platform execution (Android, Windows, Linux, macOS).
            - **Reverse-Engineered Tiny Print Hardware Engine:** Replicated exact Bluetooth Low Energy protocol (`0x51 0x78` header, CRC-8 polynomial 0x07, Deepen energy Level 5 at 9200us pulse, and 50ms chunk pacing).
            - **Unmissable Bottom Print Dock:** Large, prominent tactile master print button with real-time Bluetooth online/offline status and instant pairing.
            - **Photo & Image Upload Engine:** Added gallery/camera photo picker with automatic Floyd-Steinberg dithering and high-contrast thresholding for sharp thermal prints.
            - **Expense & Budget Tracker:** Itemized receipt block with real-time tax calculation and total computation.
            - **High-Contrast Important Callout:** Level 1 inverted memorandum box for urgent alerts and instructions.
            - **Motivational Quotes & 1-Tap Shuffle:** Built-in focus quotes from Marcus Aurelius, Steve Jobs, Seneca, etc., with 1-tap quote shuffling.
            - **Custom Gap / Spacing Controls:** Dedicated adjustable spacer blocks and ample vertical line-height so text never collides or gets hidden.
            - **Multi-Font Engine:** Mono (POS), Clean (Sans), Editorial (Serif), Retro (Arcade), Typewriter.

            ### 📦 Release Assets
            - `ThermalPrinterOS-Android.apk`: Native Android Application.
            - `ThermalPrinterOS-Windows.zip`: Native Windows Application.
            - `ThermalPrinterOS-Linux.tar.gz`: Native Linux Application.
            - `thermal-printer-os-web.zip`: Standalone Web App Distribution.
          files: release-assets/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
